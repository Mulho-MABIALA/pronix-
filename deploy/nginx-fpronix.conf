# ═══════════════════════════════════════════════════════════════════
# Config nginx réelle du site fpronix.com (serveur : /etc/nginx/sites-available/fpronix.com)
# Copie de référence, tenue à jour dans le repo. Corrige le bug écran
# noir après déploiement : sw.js/manifest/index.html doivent toujours
# être revalidés, sinon le navigateur ne détecte jamais qu'une nouvelle
# version du site est disponible.
# ═══════════════════════════════════════════════════════════════════
server {
    server_name fpronix.com www.fpronix.com;
    root /var/www/pronix/frontend/dist;
    index index.html;

    # En-têtes de sécurité — Nginx sert index.html/JS/CSS directement (sans
    # passer par Express), donc les en-têtes que helmet() ajoute déjà côté
    # API (voir backend/src/app.js) n'atteignent jamais la page HTML
    # principale, celle que scanne Mozilla Observatory. On les ajoute ici
    # pour TOUT ce que Nginx sert lui-même.
    # (Rq: /api/ reçoit déjà les mêmes en-têtes via helmet — la petite
    # duplication ici est sans effet, un CSP sur une réponse JSON pure
    # fetch()/axios n'est de toute façon jamais appliqué par le navigateur.)
    #
    # script-src/frame-src/connect-src incluent accounts.google.com pour
    # la connexion "Se connecter avec Google" (@react-oauth/google) — ne
    # jamais retirer sans vérifier que ce flux fonctionne encore.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https://images.unsplash.com https://images.fotmob.com https://logo.clearbit.com https://media.api-sports.io https://*.googleusercontent.com; font-src 'self' https: data:; style-src 'self' https: 'unsafe-inline'; script-src 'self' https://accounts.google.com; script-src-attr 'none'; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; upgrade-insecure-requests" always;
    # Aucune fonctionnalité navigateur sensible utilisée côté client (pas de
    # caméra/micro/géoloc/USB/Payment Request API — confirmé par grep sur
    # frontend/src ; seul navigator.clipboard.writeText et navigator.share
    # sont utilisés, non concernés par ces directives).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=(), interest-cohort=()" always;

    # Fichiers de contrôle : jamais de cache — sinon le navigateur ne
    # détecte jamais qu'une nouvelle version du site existe après un
    # déploiement (symptôme : écran noir/blanc, dans le navigateur
    # comme dans l'app installée).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        # IMPORTANT : ce bloc a son propre add_header (Cache-Control ci-dessus),
        # ce qui annule l'héritage des add_header du bloc server{} (comportement
        # Nginx : un location qui définit un add_header n'hérite plus AUCUN
        # add_header du parent). Comme "/" est réécrit ici via try_files, c'est
        # CE bloc qui sert effectivement la page HTML — les en-têtes de sécurité
        # doivent donc être redéclarés ici, pas seulement au niveau server{}.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https://images.unsplash.com https://images.fotmob.com https://logo.clearbit.com https://media.api-sports.io https://*.googleusercontent.com; font-src 'self' https: data:; style-src 'self' https: 'unsafe-inline'; script-src 'self' https://accounts.google.com; script-src-attr 'none'; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; upgrade-insecure-requests" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=(), interest-cohort=()" always;
    }

    # Assets buildés (nom de fichier contient un hash de contenu) :
    # cache long, sûr car le nom change à chaque nouveau build.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fpronix.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fpronix.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.fpronix.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = fpronix.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name fpronix.com www.fpronix.com;
    return 404; # managed by Certbot
}
