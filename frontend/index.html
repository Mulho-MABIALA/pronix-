<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111315" />
  <meta name="description" content="Pronostics football alimentés par IA et données temps réel. Forme, confrontations, blessures — analysés par Claude AI." />
  <title>fpronix</title>

  <!-- Google Fonts : preconnect + <link> (au lieu d'un @import CSS bloquant) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow:wght@600;700;800&display=swap" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

  <!-- iOS home screen icon -->
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/icon-192.png" />

  <!-- iOS standalone PWA meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="fpronix" />

  <!-- Applique le thème stocké AVANT le premier rendu (évite un flash de
       mode sombre pour un utilisateur ayant choisi le mode clair). -->
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
    })();
  </script>

  <!-- ── Écran de chargement initial ──────────────────────────────────────
       Rendu en HTML/CSS pur (pas de dépendance JS) pour s'afficher dès le
       tout premier paint, avant même que le bundle React soit téléchargé
       et exécuté. src/index.jsx le retire en fondu une fois l'app montée,
       avec une durée minimale d'affichage pour éviter qu'il ne fasse
       qu'un flash sur les connexions rapides. -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #131415;
      transition: opacity .5s ease, visibility .5s ease;
    }
    html.light #splash { background: #f8f9fa; }
    #splash.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .splash-glow {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26,166,86,.35) 0%, rgba(26,166,86,0) 70%);
      animation: splashGlow 2.2s ease-in-out infinite;
    }
    .splash-logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      animation: splashPulse 1.8s ease-in-out infinite;
    }
    .splash-word {
      margin-top: 18px;
      font-family: 'Barlow', Arial, sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
      color: #e7e9ea;
      position: relative;
    }
    html.light .splash-word { color: #15181b; }
    .splash-fp { color: #1aa656; }

    .splash-bar-track {
      margin-top: 22px;
      width: 120px;
      height: 3px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
      position: relative;
    }
    html.light .splash-bar-track { background: rgba(0,0,0,.08); }
    .splash-bar-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 40%;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #1aa656, transparent);
      animation: splashBar 1.3s ease-in-out infinite;
    }

    @keyframes splashPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.06); opacity: .85; }
    }
    @keyframes splashGlow {
      0%, 100% { opacity: .35; transform: scale(1); }
      50%      { opacity: .6;  transform: scale(1.15); }
    }
    @keyframes splashBar {
      0%   { transform: translateX(-140%); }
      100% { transform: translateX(240%); }
    }
  </style>
</head>
<body>
  <noscript>fpronix nécessite JavaScript pour fonctionner.</noscript>

  <div id="splash">
    <div class="splash-glow"></div>
    <img src="/logo-circle.png" alt="" class="splash-logo" />
    <p class="splash-word"><span class="splash-fp">fp</span>ronix</p>
    <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
