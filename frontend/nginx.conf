server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip — réduit d'environ 70-80% la taille des réponses JSON de
    # l'API et des assets JS/CSS. Voir deploy/nginx-fpronix.conf pour le détail.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

    # Service worker, workbox et manifest : JAMAIS de cache — sinon le
    # navigateur ne détecte jamais qu'une nouvelle version du site existe
    # et continue de charger d'anciens fichiers après un déploiement
    # (symptôme : écran noir/blanc après une mise à jour du site).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # index.html non plus : toujours revalidé, pour être sûr de toujours
    # pointer vers les derniers fichiers JS/CSS générés par le build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA — toutes les routes servent index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers l'API backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache long des assets statiques générés par le build (le nom du
    # fichier contient un hash du contenu, donc sûr de cacher longtemps —
    # sw.js/workbox/manifest/index.html sont exclus ci-dessus).
    location ~* \.(js|css|png|jpg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
