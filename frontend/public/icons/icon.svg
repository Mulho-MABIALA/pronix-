<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- Fond dégradé indigo → violet -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Cercles décoratifs flou -->
  <circle cx="430" cy="75"  r="175" fill="rgba(255,255,255,0.06)"/>
  <circle cx="75"  cy="440" r="140" fill="rgba(255,255,255,0.04)"/>

  <!-- Ballon de foot stylisé (coin haut-droite) -->
  <circle cx="368" cy="148" r="90" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="11"/>
  <!-- Pentagone central du ballon -->
  <polygon points="368,80 406,106 392,148 344,148 330,106"
           fill="rgba(255,255,255,0.18)"/>
  <!-- Branches du ballon -->
  <line x1="406" y1="106" x2="448" y2="92"  stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
  <line x1="392" y1="148" x2="430" y2="175" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
  <line x1="344" y1="148" x2="312" y2="178" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
  <line x1="330" y1="106" x2="290" y2="94"  stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
  <line x1="368" y1="80"  x2="368" y2="42"  stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Lettre "f" principale -->
  <text x="38" y="400"
        font-family="Arial Black, Impact, Helvetica Neue, Arial, sans-serif"
        font-weight="900"
        font-size="330"
        fill="white"
        opacity="0.97">f</text>

  <!-- Lettre "p" en indigo clair (accent) -->
  <text x="262" y="448"
        font-family="Arial Black, Impact, Helvetica Neue, Arial, sans-serif"
        font-weight="900"
        font-size="230"
        fill="rgba(199,210,254,0.88)">p</text>
</svg>
